name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run docs:build
      - run: npm run pterodactyl:build
      - run: git diff --exit-code -- deploy/pterodactyl/egg-aarons-support.json deploy/pterodactyl/SHA256SUMS
      - run: npm audit --omit=dev
      - run: docker build -t aarons-support:test .
